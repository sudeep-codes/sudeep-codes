  <text x="325" y="29" font-size="10" font-weight="700" fill="#61ffca" text-anchor="middle">IN PROGRESS</text>
  <text x="26" y="68" font-size="19" font-weight="700" fill="#edecee">Hostel Management System</text>
  <text x="26" y="98" font-size="12.5" fill="#b4b2c4">Full-stack hostel complaint platform, team of 3.</text>
