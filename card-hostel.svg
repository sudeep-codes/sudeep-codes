    <clipPath id="c"><rect x="1" y="1" width="398" height="262" rx="14"/></clipPath>
  </defs>
  <style>text { font-family: 'Fira Code','JetBrains Mono',Consolas,'SF Mono',monospace; } .sh { animation: sh 5s ease-in-out infinite; } .dot { animation: pulse 2s ease-in-out infinite; }
  @keyframes sh { from { transform: translateX(-200px); } to { transform: translateX(520px); } } @keyframes pulse { 50% { opacity: .35; } }</style>
  <rect x="1" y="1" width="398" height="262" rx="14" fill="url(#g)" stroke="#a277ff" stroke-opacity="0.4"/>
