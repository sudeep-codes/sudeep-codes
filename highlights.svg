    <text x="90" y="68" font-size="38" font-weight="700" fill="url(#num)" text-anchor="middle">200+</text>
    <text x="90" y="96" font-size="12" fill="#9d9bb0" text-anchor="middle">LeetCode solved</text>
  </g>
