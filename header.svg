  <rect x="1" y="1" width="998" height="298" rx="19" fill="none" stroke="#ff2d3d" stroke-opacity="0.55"/>
  <g class="r1"><text x="60" y="84" font-size="16" fill="#7ab8ff">~/sudeep-codes <tspan fill="#8a92b8">$</tspan> whoami</text></g>
  <g class="r2" filter="url(#glow)"><text x="58" y="152" font-size="56" font-weight="700" fill="url(#name)">Sudeep Kumar Sahu</text></g>
  <g class="r3">
    <text class="ph" x="60" y="200" font-size="22" fill="#edecee">Full-Stack &amp; AI/ML Developer</text>
    <text class="ph p2" x="60" y="200" font-size="22" fill="#edecee">Swinging through code, one commit at a time</text>
    <text class="ph p3" x="60" y="200" font-size="22" fill="#edecee">Building apps people actually use</text>
    <text class="ph p4" x="60" y="200" font-size="22" fill="#edecee">Turning data into decisions with ML</text>
