<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Sudeep Kumar Sahu banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1e"/><stop offset="1" stop-color="#1a1f4a"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff2d3d"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#2f6bff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="20"/></clipPath>
  </defs>
  <style>
text { font-family: 'Fira Code','JetBrains Mono',Consolas,'SF Mono',monospace; }
.o1 { animation: f1 9s ease-in-out infinite alternate; }
.o2 { animation: f2 12s ease-in-out infinite alternate; }
.cur { animation: blink 1s steps(1) infinite; }
.r1 { animation: rise 1s ease-out both; }
.r2 { animation: rise 1s ease-out .3s both; }
.r3 { animation: rise 1s ease-out .6s both; }
.ph { opacity: 0; animation: ph 15s linear infinite; }
.p2 { animation-delay: 3s; } .p3 { animation-delay: 6s; } .p4 { animation-delay: 9s; } .p5 { animation-delay: 12s; }
.sway1 { transform-origin: 660px 0px; animation: sway 4s ease-in-out infinite alternate; }
.sway2 { transform-origin: 790px 0px; animation: sway 5.5s ease-in-out infinite alternate-reverse; }
.sway3 { transform-origin: 910px 0px; animation: sway 4.6s ease-in-out infinite alternate; }
.ring { transform-origin: 860px 175px; opacity: 0; animation: ring 3.6s ease-out infinite; }
.rg2 { animation-delay: 1.2s; } .rg3 { animation-delay: 2.4s; }
@keyframes f1 { to { transform: translate(60px,25px); } }
@keyframes f2 { to { transform: translate(-70px,-25px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ph { 0% { opacity: 0; transform: translateY(8px); } 3% { opacity: 1; transform: translateY(0); } 18% { opacity: 1; transform: translateY(0); } 20% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes ring { 0% { opacity: .7; transform: scale(.1); } 100% { opacity: 0; transform: scale(1); } }
</style>
