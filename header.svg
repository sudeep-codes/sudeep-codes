<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Sudeep Kumar Sahu banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15141b"/><stop offset="1" stop-color="#241d3d"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a277ff"/><stop offset="0.5" stop-color="#61ffca"/><stop offset="1" stop-color="#f694ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#61ffca" stop-opacity="0"/><stop offset="0.5" stop-color="#61ffca" stop-opacity="0.10"/><stop offset="1" stop-color="#61ffca" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a277ff" stroke-opacity="0.09"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="20"/></clipPath>
  </defs>
  <style>
text { font-family: 'Fira Code','JetBrains Mono',Consolas,'SF Mono',monospace; }
.o1 { animation: f1 9s ease-in-out infinite alternate; }
.o2 { animation: f2 12s ease-in-out infinite alternate; }
.o3 { animation: f3 10s ease-in-out infinite alternate; }
.cur { animation: blink 1s steps(1) infinite; }
.r1 { animation: rise 1s ease-out both; }
.r2 { animation: rise 1s ease-out .3s both; }
.r3 { animation: rise 1s ease-out .6s both; }
.ph { opacity: 0; animation: ph 12s linear infinite; }
.p2 { animation-delay: 3s; } .p3 { animation-delay: 6s; } .p4 { animation-delay: 9s; }
.sym { fill: #a277ff; opacity: .22; font-weight: 700; }
.s1 { animation: fl 7s ease-in-out infinite alternate; }
.s2 { animation: fl 9s ease-in-out infinite alternate-reverse; }
.s3 { animation: fl 11s ease-in-out infinite alternate; }
.scan { animation: scan 6s linear infinite; }
@keyframes f1 { to { transform: translate(70px,25px); } }
@keyframes f2 { to { transform: translate(-80px,-25px); } }
@keyframes f3 { to { transform: translate(40px,-30px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ph { 0% { opacity: 0; transform: translateY(8px); } 3% { opacity: 1; transform: translateY(0); } 22% { opacity: 1; transform: translateY(0); } 25% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
@keyframes fl { from { transform: translateY(0); } to { transform: translateY(-22px); } }
@keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(330px); } }
</style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle class="o1" cx="760" cy="70" r="120" fill="#a277ff" opacity="0.38" filter="url(#blur)"/>
    <circle class="o2" cx="930" cy="240" r="100" fill="#61ffca" opacity="0.24" filter="url(#blur)"/>
    <circle class="o3" cx="540" cy="290" r="90" fill="#f694ff" opacity="0.18" filter="url(#blur)"/>
    <text class="sym s1" x="640" y="90" font-size="40">{ }</text>
    <text class="sym s2" x="760" y="200" font-size="34">&lt;/&gt;</text>
    <text class="sym s3" x="880" y="110" font-size="30">01</text>
    <text class="sym s2" x="700" y="260" font-size="30">=&gt;</text>
    <text class="sym s1" x="900" y="250" font-size="36">[ ]</text>
    <text class="sym s3" x="580" y="170" font-size="26">λ</text>
    <rect class="scan" x="0" y="0" width="1000" height="26" fill="url(#scanG)"/>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="19" fill="none" stroke="#a277ff" stroke-opacity="0.4"/>
  <g class="r1"><text x="60" y="84" font-size="16" fill="#61ffca">~/sudeep-codes <tspan fill="#6d6d6d">$</tspan> whoami</text></g>
  <g class="r2" filter="url(#glow)"><text x="58" y="152" font-size="56" font-weight="700" fill="url(#name)">Sudeep Kumar Sahu</text></g>
  <g class="r3">
    <text class="ph" x="60" y="200" font-size="22" fill="#edecee">Full-Stack &amp; AI/ML Developer</text>
    <text class="ph p2" x="60" y="200" font-size="22" fill="#edecee">Building apps people actually use</text>
    <text class="ph p3" x="60" y="200" font-size="22" fill="#edecee">Turning data into decisions with ML</text>
    <text class="ph p4" x="60" y="200" font-size="22" fill="#edecee">200+ LeetCode problems and counting</text>
    <text x="60" y="244" font-size="14" fill="#9d9bb0">CSE @ VIT Vellore  ·  React · TypeScript · Python · C++</text>
    <rect class="cur" x="60" y="256" width="10" height="18" fill="#61ffca"/>
  </g>
</svg>
