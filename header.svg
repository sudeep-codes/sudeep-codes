<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Sudeep Kumar Sahu banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15141b"/><stop offset="1" stop-color="#211d36"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a277ff"/><stop offset="1" stop-color="#61ffca"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a277ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clip"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono',Consolas,'SF Mono',monospace; }
    .orb1 { animation: f1 9s ease-in-out infinite alternate; }
    .orb2 { animation: f2 11s ease-in-out infinite alternate; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .in1 { animation: rise 1s ease-out both; }
    .in2 { animation: rise 1s ease-out .3s both; }
    .in3 { animation: rise 1s ease-out .6s both; }
    .in4 { animation: rise 1s ease-out .9s both; }
    @keyframes f1 { from { transform: translate(0,0); } to { transform: translate(60px,25px); } }
    @keyframes f2 { from { transform: translate(0,0); } to { transform: translate(-70px,-20px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <circle class="orb1" cx="780" cy="60" r="110" fill="#a277ff" opacity="0.35" filter="url(#blur)"/>
    <circle class="orb2" cx="900" cy="210" r="90" fill="#61ffca" opacity="0.22" filter="url(#blur)"/>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#a277ff" stroke-opacity="0.35"/>
  <g class="in1"><text x="60" y="78" font-size="16" fill="#61ffca">~/sudeep-codes <tspan fill="#6d6d6d">$</tspan> whoami</text></g>
  <g class="in2"><text x="58" y="142" font-size="52" font-weight="700" fill="url(#name)">Sudeep Kumar Sahu</text></g>
  <g class="in3"><text x="60" y="184" font-size="21" fill="#edecee">Full-Stack &amp; AI/ML Developer</text></g>
  <g class="in4">
    <text x="60" y="222" font-size="14" fill="#9d9bb0">CSE @ VIT Vellore  ·  React · TypeScript · Python · C++</text>
    <rect class="cursor" x="520" y="208" width="9" height="17" fill="#61ffca"/>
  </g>
</svg>
